
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 저녁 뭐 먹지?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="theme-switch">
            <button id="theme-toggle">Toggle Theme</button>
        </div>
        <h1>저녁 메뉴 추천</h1>
        <div class="menu-display">
            <img id="menu-image" src="" alt="Dinner menu image" />
            <span class="menu-item"></span>
        </div>
        <button id="recommend-btn">메뉴 추천받기</button>
    </div>

    <div class="partnership-form-container">
        <h2>제휴 문의</h2>
        <form action="https://formspree.io/f/meelgzkj" method="POST" class="partnership-form">
            <label for="name">이름:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">이메일:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">메시지:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">보내기</button>
        </form>
    </div>

    <script src="main.js"></script>
</body>
</html>
